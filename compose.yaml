services:
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: production
      ENABLE_LOCAL_PYTHON_EXECUTION: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - agent_examples:/app/examples
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agent_examples:
