<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>对话</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="app">
    <header class="topbar">
        <div class="symbol" aria-hidden="true">d</div>
        <button id="newChatButton" class="new-chat" type="button">新对话</button>
    </header>

    <section id="chatBox" class="conversation" role="log" aria-live="polite">
        <div id="conversationInner" class="conversation-inner">
            <div id="welcome" class="welcome">
                <div class="welcome-mark" aria-hidden="true">d</div>
                <h1>有什么可以帮你？</h1>
                <p>输入一个问题，或从你正在处理的事情开始。</p>
            </div>
        </div>
    </section>

    <footer class="composer-area">
        <div class="composer">
            <textarea id="messageInput" rows="1" maxlength="10000" aria-label="输入消息" placeholder="发消息…"></textarea>
            <button id="sendButton" class="send" type="button" aria-label="发送消息">↑</button>
        </div>
        <p class="note">内容可能存在误差，请核对重要信息</p>
    </footer>
</main>

<script src="/static/app.js" defer></script>
</body>
</html>
