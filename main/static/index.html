<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>对话</title>
    <style>
        :root {
            --bg: #fbfaf7;
            --text: #20211f;
            --secondary: #777973;
            --line: #e8e6df;
            --surface: #f1f0eb;
            --surface-hover: #eae8e1;
            --accent: #265f4b;
            --accent-hover: #1e4e3d;
            --error: #9f3f3a;
            --error-bg: #f9ece9;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            min-width: 320px;
            color: var(--text);
            background: var(--bg);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button, textarea { font: inherit; }

        .app {
            height: 100%;
            display: grid;
            grid-template-rows: 68px minmax(0, 1fr) auto;
        }

        .topbar {
            width: 100%;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
            background: rgba(251, 250, 247, .9);
            backdrop-filter: blur(14px);
        }

        .symbol {
            width: 31px;
            height: 31px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #fff;
            background: var(--accent);
            font-family: Georgia, serif;
            font-size: 17px;
            font-style: italic;
            user-select: none;
        }

        .new-chat {
            padding: 8px 12px;
            border: 0;
            border-radius: 9px;
            color: var(--secondary);
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            transition: color .16s ease, background .16s ease;
        }

        .new-chat:hover { color: var(--text); background: var(--surface); }

        .conversation {
            min-height: 0;
            overflow-y: auto;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: #d7d4cc transparent;
        }

        .conversation-inner {
            width: min(760px, calc(100% - 40px));
            min-height: 100%;
            margin: 0 auto;
            padding: 48px 0 26px;
        }

        .welcome {
            min-height: 70%;
            display: grid;
            place-content: center;
            justify-items: center;
            text-align: center;
        }

        .welcome-mark {
            width: 46px;
            height: 46px;
            margin-bottom: 22px;
            display: grid;
            place-items: center;
            border: 1px solid #dcd9d0;
            border-radius: 50%;
            color: var(--accent);
            background: #fff;
            font-family: Georgia, serif;
            font-size: 22px;
            font-style: italic;
            box-shadow: 0 7px 22px rgba(43, 49, 44, .06);
        }

        .welcome h1 {
            margin: 0;
            font-family: Georgia, "Songti SC", "STSong", serif;
            font-size: clamp(27px, 4vw, 36px);
            font-weight: 500;
            letter-spacing: -.035em;
        }

        .welcome p {
            margin: 13px 0 0;
            color: var(--secondary);
            font-size: 14px;
            line-height: 1.7;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 13px;
            margin: 0 0 30px;
        }

        .message.user { justify-content: flex-end; }

        .avatar {
            width: 28px;
            height: 28px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: white;
            background: var(--accent);
            font-family: Georgia, serif;
            font-size: 13px;
            font-style: italic;
        }

        .message-content {
            max-width: calc(100% - 44px);
            padding: 3px 0;
            color: #2a2c29;
            font-size: 15px;
            line-height: 1.78;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user .message-content {
            max-width: 78%;
            padding: 10px 15px;
            border-radius: 16px 16px 4px 16px;
            background: var(--surface);
            line-height: 1.65;
        }

        .message.error .message-content {
            padding: 10px 14px;
            border-radius: 10px;
            color: var(--error);
            background: var(--error-bg);
        }

        .loading .message-content {
            min-height: 28px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #92958e;
            animation: breathe 1.15s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: .14s; }
        .dot:nth-child(3) { animation-delay: .28s; }

        @keyframes breathe {
            0%, 65%, 100% { opacity: .28; transform: translateY(0); }
            32% { opacity: 1; transform: translateY(-2px); }
        }

        .composer-area {
            padding: 12px 20px max(20px, env(safe-area-inset-bottom));
            background: linear-gradient(to top, var(--bg) 76%, rgba(251, 250, 247, 0));
        }

        .composer {
            width: min(780px, 100%);
            margin: 0 auto;
            padding: 8px 8px 8px 16px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            border: 1px solid #dedbd3;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(41, 45, 40, .07);
            transition: border-color .16s ease, box-shadow .16s ease;
        }

        .composer:focus-within {
            border-color: #a9b9b0;
            box-shadow: 0 12px 34px rgba(41, 45, 40, .09);
        }

        textarea {
            flex: 1;
            min-height: 44px;
            max-height: 160px;
            padding: 11px 0 9px;
            border: 0;
            outline: 0;
            resize: none;
            color: var(--text);
            background: transparent;
            font-size: 15px;
            line-height: 1.55;
        }

        textarea::placeholder { color: #999b96; }

        .send {
            width: 42px;
            height: 42px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 13px;
            color: #fff;
            background: var(--accent);
            cursor: pointer;
            font-size: 18px;
            transition: background .16s ease, transform .12s ease, opacity .16s ease;
        }

        .send:hover { background: var(--accent-hover); }
        .send:active { transform: scale(.96); }
        .send:disabled { opacity: .38; cursor: default; }

        .new-chat:focus-visible, .send:focus-visible, textarea:focus-visible {
            outline: 3px solid rgba(38, 95, 75, .15);
            outline-offset: 2px;
        }

        .note {
            margin: 9px auto 0;
            color: #a09f99;
            text-align: center;
            font-size: 11px;
        }

        @media (max-width: 640px) {
            .app { grid-template-rows: 58px minmax(0, 1fr) auto; }
            .topbar { padding: 0 16px; }
            .conversation-inner { width: calc(100% - 28px); padding-top: 30px; }
            .welcome { min-height: 64%; }
            .welcome p { max-width: 290px; }
            .message { margin-bottom: 24px; gap: 10px; }
            .user .message-content { max-width: 86%; }
            .composer-area { padding: 10px 10px max(10px, env(safe-area-inset-bottom)); }
            .composer { border-radius: 16px; }
            .note { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
<main class="app">
    <header class="topbar">
        <div class="symbol" aria-hidden="true">d</div>
        <button id="newChatButton" class="new-chat" type="button">新对话</button>
    </header>

    <section id="chatBox" class="conversation" role="log" aria-live="polite">
        <div id="conversationInner" class="conversation-inner">
            <div id="welcome" class="welcome">
                <div class="welcome-mark" aria-hidden="true">d</div>
                <h1>有什么可以帮你？</h1>
                <p>输入一个问题，或从你正在处理的事情开始。</p>
            </div>
        </div>
    </section>

    <footer class="composer-area">
        <div class="composer">
            <textarea id="messageInput" rows="1" maxlength="10000" aria-label="输入消息" placeholder="发消息…"></textarea>
            <button id="sendButton" class="send" type="button" aria-label="发送消息">↑</button>
        </div>
        <p class="note">内容可能存在误差，请核对重要信息</p>
    </footer>
</main>

<script>
    const chatBox = document.getElementById("chatBox");
    const conversationInner = document.getElementById("conversationInner");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const newChatButton = document.getElementById("newChatButton");

    const newSessionId = () => crypto.randomUUID();
    let sessionId = localStorage.getItem("chat_session_id");
    if (!sessionId) {
        sessionId = newSessionId();
        localStorage.setItem("chat_session_id", sessionId);
    }

    function removeWelcome() {
        document.getElementById("welcome")?.remove();
    }

    function scrollToLatest() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addMessage(content, role, isError = false) {
        removeWelcome();
        const message = document.createElement("div");
        message.className = `message ${role}${isError ? " error" : ""}`;

        if (role === "model") {
            const avatar = document.createElement("div");
            avatar.className = "avatar";
            avatar.textContent = "d";
            avatar.setAttribute("aria-hidden", "true");
            message.appendChild(avatar);
        }

        const contentNode = document.createElement("div");
        contentNode.className = "message-content";
        contentNode.textContent = content;
        message.appendChild(contentNode);
        conversationInner.appendChild(message);
        scrollToLatest();
        return message;
    }

    function addLoading() {
        const message = addMessage("", "model");
        message.classList.add("loading");
        message.querySelector(".message-content").innerHTML =
            '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
        return message;
    }

    function resizeInput() {
        messageInput.style.height = "auto";
        messageInput.style.height = `${Math.min(messageInput.scrollHeight, 160)}px`;
    }

    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message || sendButton.disabled) return;

        addMessage(message, "user");
        messageInput.value = "";
        resizeInput();
        sendButton.disabled = true;
        const loading = addLoading();

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: sessionId, message })
            });
            const data = await response.json();
            loading.remove();
            addMessage(
                data.answer || "暂时没有得到有效回复，请稍后再试。",
                "model",
                !data.success
            );
        } catch (error) {
            loading.remove();
            addMessage(`连接失败：${error.message}`, "model", true);
        } finally {
            sendButton.disabled = false;
            messageInput.focus();
        }
    }

    async function startNewChat() {
        const previousSessionId = sessionId;
        sessionId = newSessionId();
        localStorage.setItem("chat_session_id", sessionId);
        conversationInner.innerHTML = `
            <div id="welcome" class="welcome">
                <div class="welcome-mark" aria-hidden="true">d</div>
                <h1>有什么可以帮你？</h1>
                <p>输入一个问题，或从你正在处理的事情开始。</p>
            </div>`;
        try {
            await fetch(`/sessions/${previousSessionId}`, { method: "DELETE" });
        } catch (_) {
            // 服务端清理失败不阻止新建本地会话。
        }
        messageInput.focus();
    }

    sendButton.addEventListener("click", sendMessage);
    newChatButton.addEventListener("click", startNewChat);
    messageInput.addEventListener("input", resizeInput);
    messageInput.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
