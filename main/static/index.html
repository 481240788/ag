<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MCP Agent Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;

            background: #f5f7fb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 900px;
            height: 90vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);

            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部 */
        .header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 24px;

            border-bottom: 1px solid #eee;
            font-size: 20px;
            font-weight: 600;
        }

        .header span {
            margin-left: 10px;
            font-size: 13px;
            color: #888;
            font-weight: normal;
        }

        /* 聊天区域 */
        .chat-box {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: #fafbfc;
        }

        /* 一条消息 */
        .message {
            display: flex;
            margin-bottom: 20px;
        }

        /* Model 左边 */
        .message.model {
            justify-content: flex-start;
        }

        /* 用户右边 */
        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Model */
        .model .message-content {
            background: white;
            border: 1px solid #e5e7eb;
            color: #333;
        }

        /* User */
        .user .message-content {
            background: #1677ff;
            color: white;
        }

        /* 输入区域 */
        .input-area {
            border-top: 1px solid #eee;
            padding: 15px;

            display: flex;
            gap: 10px;
            background: white;
        }

        textarea {
            flex: 1;

            resize: none;
            height: 50px;

            border: 1px solid #ddd;
            border-radius: 8px;

            padding: 12px;

            font-size: 14px;
            font-family: inherit;

            outline: none;
        }

        textarea:focus {
            border-color: #1677ff;
        }

        button {
            width: 80px;

            border: none;
            border-radius: 8px;

            background: #1677ff;
            color: white;

            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #4096ff;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        /* Loading */
        .loading {
            color: #999;
            font-size: 14px;
        }
    </style>
</head>


<body>

<div class="chat-container">

    <div class="header">
        🤖 MCP Agent
        <span>FastAPI + Agent</span>
    </div>


    <div id="chatBox" class="chat-box">

        <!-- 初始消息 -->
        <div class="message model">
            <div class="message-content">
                你好，我是你的 Agent，有什么可以帮你？
            </div>
        </div>

    </div>


    <div class="input-area">

        <textarea
            id="messageInput"
            placeholder="请输入你的问题，例如：做一个 Python 程序计算 1~100 的所有素数..."
        ></textarea>

        <button id="sendButton">
            发送
        </button>

    </div>

</div>


<script>

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");


    // 添加消息
    function addMessage(content, role) {

        const message = document.createElement("div");

        message.className = `message ${role}`;

        const messageContent = document.createElement("div");

        messageContent.className = "message-content";

        messageContent.textContent = content;

        message.appendChild(messageContent);

        chatBox.appendChild(message);

        // 自动滚动到底部
        chatBox.scrollTop = chatBox.scrollHeight;

        return messageContent;
    }


    // 发送消息
    async function sendMessage() {

        const message = messageInput.value.trim();

        if (!message) {
            return;
        }


        // 显示用户消息
        addMessage(message, "user");


        // 清空输入框
        messageInput.value = "";


        // 禁用发送按钮
        sendButton.disabled = true;

        sendButton.textContent = "执行中";


        // 添加 Loading
        const loadingMessage = addMessage(
            "Agent 正在执行，请稍等...",
            "model"
        );

        loadingMessage.classList.add("loading");


        try {

            const response = await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })

            });


            const data = await response.json();


            // 删除 Loading
            loadingMessage.parentElement.remove();


            if (data.success) {

                addMessage(
                    data.answer,
                    "model"
                );

            } else {

                addMessage(
                    data.answer,
                    "model"
                );

            }


        } catch (error) {

            loadingMessage.textContent =
                "请求失败：" + error.message;

        }


        sendButton.disabled = false;

        sendButton.textContent = "发送";


        messageInput.focus();
    }


    // 点击发送
    sendButton.addEventListener(
        "click",
        sendMessage
    );


    // Enter 发送
    messageInput.addEventListener(
        "keydown",
        function(event) {

            // Enter
            if (event.key === "Enter" && !event.shiftKey) {

                event.preventDefault();

                sendMessage();

            }

        }
    );

</script>

</body>

</html>
